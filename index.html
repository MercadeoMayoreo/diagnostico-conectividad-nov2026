<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Prevent browser crashes in sandboxed iframe contexts where window.fetch is a read-only getter
      try {
        const originalFetch = window.fetch;
        if (originalFetch) {
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get() {
              return currentFetch;
            },
            set(val) {
              currentFetch = val;
            }
          });
        }
      } catch (err) {
        console.warn("Unable to configure writable window.fetch proxy:", err);
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diagnóstico de conectividad</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
